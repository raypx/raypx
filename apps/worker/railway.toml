[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"
watchPatterns = ["/apps/worker/**", "/packages/**", "/package.json", "/bun.lock", "/vite.config.ts"]

[deploy]
startCommand = "bun --no-env-file --no-install .output/server/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
