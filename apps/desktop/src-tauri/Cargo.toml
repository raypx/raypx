[package]
name = "raypx-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "raypx_desktop"
crate-type = ["lib"]

[features]
default = []
native-smoke = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
orpc = "=1.1.0"
orpc-client = "=1.1.0"
toml = "1"
sha2 = "0.11"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
aes-gcm = "0.11"
base64 = "0.23"
rand = "0.10"
keyring = "4.2"
tokio = { version = "1", features = [
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "rt-multi-thread",
  "net",
  "signal",
  "fs",
] }
tokio-util = "0.7"
futures-util = "0.3"
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
