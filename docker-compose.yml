# Docker Compose for Raypx

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raypx-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/raypx.db
    volumes:
      # Persist database
      - raypx-data:/app/data
      # Optional: Mount logs
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - raypx-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: raypx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - raypx-network

volumes:
  raypx-data:
    driver: local

networks:
  raypx-network:
    driver: bridge
