# Development Docker Compose
# For local development with hot reload

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: raypx-dev
    ports:
      - "3000:3000"
      - "5173:5173" # Vite HMR
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - raypx-dev-data:/app/data
    command: bun run dev
    stdin_open: true
    tty: true
    networks:
      - raypx-dev-network

volumes:
  raypx-dev-data:

networks:
  raypx-dev-network:
