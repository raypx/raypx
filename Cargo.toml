[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/raypx/raypx"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
# Keep backtrace locations without generating full type/variable debug data.
# Tests inherit this profile; Cargo's default incremental compilation stays enabled.
debug = 1

[profile.dev.package."*"]
# Dependencies omit debug data; workspace packages keep the setting above.
debug = 0

[profile.release]
# Shipped binaries drop the symbol table; release panic backtraces show addresses only.
strip = true
