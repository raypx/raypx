name: CLI size experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pinned compiler size, isolated AOT, or separate Bun runtime comparison
        type: choice
        options: [size, aot, split]
        default: size
permissions:
  contents: read
env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
jobs:
  windows:
    if: inputs.mode == 'size'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run build:cli
      - name: Prepare pinned UPX experiment
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "upx.zip"
          Invoke-WebRequest https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "D127996C76615E431BE810E9C8D2910DBE3DD400600C5C0C50276FC5A17A9705") {
            throw "UPX archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "RAYPX_EXPERIMENT_UPX=$env:RUNNER_TEMP\upx-5.3.0-win64\upx.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compare executable sizes and command startup
        id: measurements
        shell: bash
        run: bun run raypx-dev cli:experiment apps/cli/dist --upx "$RAYPX_EXPERIMENT_UPX"
      - name: Enable isolated provider acceptance
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
      - name: Accept smaller bytecode payload
        env:
          RAYPX_CLI_PAYLOAD: ${{ steps.measurements.outputs.depth0-payload }}
        shell: bash
        run: |
          test -n "$RAYPX_CLI_PAYLOAD"
          bun run --cwd apps/cli smoke
          RAYPX_HERDR_COMPILED=1 bun run --cwd apps/cli smoke:herdr-terminal
      - name: Report measurements
        if: always()
        shell: bash
        run: cat .artifacts/cli-size/*/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cli-size-windows
          path: |
            .artifacts/cli-size/*/results.json
            .artifacts/cli-size/*/report.md
          if-no-files-found: error
  aot:
    if: inputs.mode == 'aot'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run build:cli
      - name: Prepare isolated experimental compiler
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "bun-aot.zip"
          $headers = @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest https://api.github.com/repos/oven-sh/bun/releases/assets/715114439 -Headers $headers -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "C7448CB32FD91F32135A455F032365C48E8C5404D5EBA844B179B8F97B5397D4") {
            throw "Experimental Bun archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "bun-aot")
          "RAYPX_AOT_COMPILER=$env:RUNNER_TEMP\bun-aot\bun-windows-x64\bun.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Probe AOT sizes and runtime capabilities
        id: experiment
        shell: bash
        run: bun packages/tooling/src/validation/bun-aot.ts "$RAYPX_AOT_COMPILER" apps/cli/dist
      - name: Enable isolated provider acceptance
        if: steps.experiment.outputs.aot-payload != ''
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
      - name: Accept the smallest candidate retaining runtime capabilities
        if: steps.experiment.outputs.aot-payload != ''
        env:
          RAYPX_CLI_PAYLOAD: ${{ steps.experiment.outputs.aot-payload }}
        shell: bash
        run: |
          bun run --cwd apps/cli smoke
          RAYPX_HERDR_COMPILED=1 bun run --cwd apps/cli smoke:herdr-terminal
      - name: Report AOT measurements
        if: always()
        shell: bash
        run: cat .artifacts/bun-aot/*/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bun-aot-windows
          include-hidden-files: true
          path: |
            .artifacts/bun-aot/*/results.json
            .artifacts/bun-aot/*/report.md
            .artifacts/bun-aot/*/*/build.log
          if-no-files-found: error

  split:
    if: inputs.mode == 'split'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Prepare the unchanged production reference
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          bun run build:cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RAYPX_SPLIT_REFERENCE_MS=$($timer.ElapsedMilliseconds)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare pinned Rust for the small launcher
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern 'channel = "([^" ]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal
      - name: Enable isolated provider acceptance
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
      - name: Compare and accept all three complete distributions
        shell: bash
        run: bun packages/tooling/src/validation/bun-split.ts apps/cli/dist
      - name: Report split runtime measurements
        if: always()
        shell: bash
        run: cat .artifacts/bun-split/*/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bun-split-windows
          retention-days: 7
          include-hidden-files: true
          path: |
            .artifacts/bun-split/*/results.json
            .artifacts/bun-split/*/report.md
            .artifacts/bun-split/*/*.log
            .artifacts/bun-split/*/*-daemon-ready.json
          if-no-files-found: error
