name: Rust libraries
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "packages/tooling/src/tasks/**"
      - "packages/tooling/tests/unit/rust-tasks.test.ts"
      - ".github/workflows/rust.yml"
  push:
    branches: [canary, next]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "packages/tooling/src/tasks/**"
      - "packages/tooling/tests/unit/rust-tasks.test.ts"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude raypx-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude raypx-desktop --locked
