name: Rust libraries
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-libraries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: raypx-rust-v2
          cache-on-failure: "false"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude raypx-desktop --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --exclude raypx-desktop --all-features --locked
