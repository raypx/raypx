name: Native acceptance
on:
  workflow_call:
    inputs:
      runner:
        description: Hosted macOS or Windows runner
        required: true
        type: string
      distribution:
        description: Include installers, signatures and installed GUI acceptance
        type: boolean
        default: false
permissions:
  contents: read
env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
jobs:
  prepare:
    name: Prepare native inputs and Herdr
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Use the pinned Rust toolchain
        uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/vp-restore
        id: vp-cache
        with:
          partition: desktop
      - name: Prepare CLI and optional distribution renderer
        shell: bash
        run: |
          if [ "${{ inputs.distribution }}" = "true" ]; then
            bun run build:desktop
          fi
          bun run build:cli
          bun run --cwd apps/desktop tauri:generate
          bun run --cwd apps/desktop tauri:cli ${{ inputs.distribution && '--release' || '' }}
      - name: Herdr terminal integration
        env:
          RAYPX_HERDR_COMPILED: "1"
        shell: bash
        run: |
          bun - <<'TS'
          for (let attempt = 0; attempt < (process.platform === "win32" ? 3 : 1); attempt++) {
            const child = Bun.spawn([process.execPath, "run", "--cwd", "apps/cli", "smoke:herdr-terminal"], {
              stdin: "ignore", stdout: "inherit", stderr: "inherit", windowsHide: true,
            });
            const code = await child.exited;
            if (code !== 0) process.exit(code);
          }
          TS
      # One VP cache writer per platform. Consumers only restore prepared JS outputs.
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.vp-cache.outputs.key }}
  verify:
    name: ${{ matrix.phase }}
    needs: prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.distribution && '["checks","package","smoke"]' || '["checks"]') }}
    env:
      APPLE_CERTIFICATE: ${{ matrix.phase == 'package' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ matrix.phase == 'package' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ matrix.phase == 'package' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ matrix.phase == 'package' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ matrix.phase == 'package' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.phase == 'package' && secrets.APPLE_TEAM_ID || '' }}
      WINDOWS_CERTIFICATE: ${{ matrix.phase == 'package' && secrets.WINDOWS_CERTIFICATE || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ matrix.phase == 'package' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.phase == 'package' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.phase == 'package' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      RAYPX_UPDATER_PUBLIC_KEY: ${{ matrix.phase == 'package' && vars.RAYPX_UPDATER_PUBLIC_KEY || '' }}
      RAYPX_UPDATER_ENDPOINT: ${{ matrix.phase == 'package' && vars.RAYPX_UPDATER_ENDPOINT || '' }}
      RAYPX_UPDATER_ASSET_BASE_URL: ${{ matrix.phase == 'package' && vars.RAYPX_UPDATER_ASSET_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/vp-restore
        with:
          partition: desktop
      # Each phase owns its archive: a smaller check cache cannot replace release/smoke dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: raypx-rust-v2
          shared-key: desktop-${{ matrix.phase }}
          workspaces: . -> ${{ matrix.phase == 'smoke' && 'target/native-smoke' || 'target' }}
          cache-on-failure: "false"
      - name: Prepare native check or distribution inputs
        shell: bash
        run: |
          if [ "${{ matrix.phase }}" = "checks" ]; then
            mkdir -p apps/desktop/dist/client
            printf '<!doctype html>\n' > apps/desktop/dist/client/index.html
          else
            bun run build:desktop
          fi
          bun run build:cli
          bun run --cwd apps/desktop tauri:generate
          bun run --cwd apps/desktop tauri:cli ${{ matrix.phase != 'checks' && '--release' || '' }}
      - name: Desktop Rust checks
        if: matrix.phase == 'checks'
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy -p raypx-desktop --all-targets --locked -- -D warnings
          cargo clippy -p raypx-desktop --all-targets --all-features --locked -- -D warnings
          cargo test -p raypx-desktop --all-features --locked
      - name: Import macOS signing certificate
        if: matrix.phase == 'package' && (runner.os == 'macOS' && env.APPLE_CERTIFICATE != '')
        run: |
          certificate_path="$RUNNER_TEMP/raypx-signing.p12"
          keychain_path="$RUNNER_TEMP/raypx-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          echo "RAYPX_DESKTOP_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
      - name: Import Windows signing certificate
        if: matrix.phase == 'package' && (runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '')
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "raypx-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw "The signing certificate has no private key" }
            $configPath = Join-Path $env:RUNNER_TEMP "raypx-tauri-signing.json"
            @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
            "RAYPX_DESKTOP_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RAYPX_DESKTOP_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Remove-Item $certificatePath -ErrorAction SilentlyContinue
          }
      - name: Configure native bundles and optional updater signing
        if: matrix.phase == 'package'
        shell: bash
        run: |
          bun - <<'TS'
          import { appendFileSync, rmSync } from "node:fs";
          import { join } from "node:path";
          const source = process.env.RAYPX_DESKTOP_SIGNING_CONFIG;
          const config = source ? await Bun.file(source).json() : {};
          config.bundle ??= {};
          config.bundle.targets = process.platform === "win32" ? ["nsis"] : ["app", "dmg"];
          if (process.env.TAURI_SIGNING_PRIVATE_KEY) {
            if (!process.env.RAYPX_UPDATER_PUBLIC_KEY || !process.env.RAYPX_UPDATER_ENDPOINT?.startsWith("https://"))
              throw new Error("Updater signing requires a public key and HTTPS manifest endpoint");
            config.bundle.createUpdaterArtifacts = true;
          } else {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY!, "Updater signing: not configured; no signed updater artifacts generated.\n");
          }
          const path = join(process.env.RUNNER_TEMP!, "raypx-tauri-bundle.json");
          await Bun.write(path, JSON.stringify(config));
          appendFileSync(process.env.GITHUB_ENV!, `RAYPX_DESKTOP_BUNDLE_CONFIG=${path}\n`);
          rmSync("target/release/bundle", { recursive: true, force: true });
          TS
      - name: Package desktop
        if: matrix.phase == 'package'
        shell: bash
        run: bun run package:desktop --config "$RAYPX_DESKTOP_BUNDLE_CONFIG"
      - name: Verify production Desktop excludes smoke controls
        if: matrix.phase == 'package'
        shell: bash
        run: bun apps/desktop/scripts/native/check-release.ts
      - name: Verify macOS distribution signature
        if: matrix.phase == 'package' && (runner.os == 'macOS')
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --verify --deep --strict target/release/bundle/macos/Raypx.app
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              xcrun stapler validate target/release/bundle/macos/Raypx.app
              echo "macOS installer: Developer ID signed and notarization verified." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "macOS installer: Developer ID signed; notarization credentials were not configured." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "macOS installer: unsigned distribution; Developer ID credentials were not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify Windows distribution signature
        if: matrix.phase == 'package' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          if ($env:RAYPX_DESKTOP_SIGNING_THUMBPRINT) {
            $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
            if ($installers.Count -eq 0) { throw "No NSIS installer was produced" }
            foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature $installer.FullName
              if ($signature.Status -ne "Valid") { throw "Installer Authenticode signature is not valid" }
            }
            "Windows installer: Authenticode signature verified." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "Windows installer: unsigned distribution; Authenticode credentials were not configured." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Generate platform updater manifest
        if: matrix.phase == 'package'
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun apps/desktop/scripts/native/update-manifest.ts
          else
            echo "Static updater manifest: skipped because updater signing is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload desktop installers
        if: matrix.phase == 'package'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.sig
            target/release/bundle/update-*.json
          if-no-files-found: error
      - name: Remove temporary Windows signing material
        if: matrix.phase == 'package' && (always() && runner.os == 'Windows')
        shell: pwsh
        run: |
          if ($env:RAYPX_DESKTOP_SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:RAYPX_DESKTOP_SIGNING_THUMBPRINT" -ErrorAction SilentlyContinue
          }
          if ($env:RAYPX_DESKTOP_SIGNING_CONFIG) {
            Remove-Item $env:RAYPX_DESKTOP_SIGNING_CONFIG -ErrorAction SilentlyContinue
          }
          if ($env:RAYPX_DESKTOP_BUNDLE_CONFIG) {
            Remove-Item $env:RAYPX_DESKTOP_BUNDLE_CONFIG -ErrorAction SilentlyContinue
          }
      - name: Remove temporary macOS signing material
        if: matrix.phase == 'package' && (always() && runner.os == 'macOS')
        run: |
          if [ -n "$RAYPX_DESKTOP_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$RAYPX_DESKTOP_SIGNING_KEYCHAIN"
          fi
          if [ -n "$RAYPX_DESKTOP_BUNDLE_CONFIG" ]; then
            rm -f "$RAYPX_DESKTOP_BUNDLE_CONFIG"
          fi
      - name: Packaged native smoke
        if: matrix.phase == 'smoke'
        run: bun run --cwd apps/desktop native:smoke:interactive
