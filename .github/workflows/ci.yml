name: CI
# raypx canary baseline policy v1
on:
  pull_request:
  push:
    branches: [dev, canary, next]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      distribution:
        description: Build installers and run full packaged native acceptance
        type: boolean
        default: false
      macos:
        description: Include macOS native checks and distribution (automatic for release tags)
        type: boolean
        default: false
      cold_native:
        description: Disable native compiler caches for build comparisons
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.distribution || false }}-${{ inputs.macos || false }}-${{ inputs.cold_native || false }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
jobs:
  changes:
    name: Plan verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      source_phases: ${{ steps.plan.outputs.source_phases }}
      go: ${{ steps.plan.outputs.go }}
      native: ${{ steps.plan.outputs.native }}
      native_runners: ${{ steps.plan.outputs.native_runners }}
      container_smoke: ${{ steps.plan.outputs.container_smoke }}
      backend: ${{ steps.plan.outputs.backend }}
      browser: ${{ steps.plan.outputs.browser }}
      distribution: ${{ steps.plan.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install planner dependencies
        run: bun install --frozen-lockfile --production --filter '@raypx/dev-cli' --ignore-scripts
      - name: Select affected verification gates
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run raypx-dev ci:plan
  source:
    name: ${{ matrix.phase == 'checks' && 'Source checks' || 'Source tests' }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.changes.outputs.source_phases) }}
    env:
      RAYPX_CI_PLAN: ${{ needs.changes.outputs.plan }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-go@v6
        if: matrix.phase == 'checks' && needs.changes.outputs.go == 'true'
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - uses: ./.github/actions/turbo-restore
        id: turbo-cache
        with:
          # Keep existing check artifacts; test runners publish a separate cache.
          partition: ${{ matrix.phase == 'checks' && 'javascript' || 'source-tests' }}
      - name: Verify selected source phase
        run: bun run raypx-dev ci:gate source ${{ matrix.phase }}
      - name: Generated sources remain reproducible
        run: git diff --exit-code
      - uses: ./.github/actions/turbo-save
        with:
          key: ${{ steps.turbo-cache.outputs.key }}
  backend:
    name: Backend integration
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raypx
          POSTGRES_PASSWORD: raypx
          POSTGRES_DB: raypx_foundation_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raypx -d raypx_foundation_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAYPX_CI_PLAN: ${{ needs.changes.outputs.plan }}
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://raypx:raypx@127.0.0.1:5432/raypx_foundation_ci_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run raypx-dev ci:gate backend
  browser:
    name: Browser acceptance
    needs: changes
    env:
      RAYPX_CI_PLAN: ${{ needs.changes.outputs.plan }}
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/turbo-restore
        id: turbo-cache
        with:
          partition: browser
      - name: Resolve Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(bun --bun playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Headless runs only launch the Chromium shell; browser revisions follow the Playwright version.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun --bun playwright install --only-shell chromium
        working-directory: e2e
      # The runner image usually provides Chromium's libraries; apt runs only when one is missing.
      - name: Install missing Chromium system libraries
        working-directory: e2e
        run: |
          shell="$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell | head -n 1)"
          test -n "$shell"
          if ldd "$shell" | grep -q "not found"; then
            bun --bun playwright install-deps chromium
          fi
      - run: bun run raypx-dev ci:gate browser
      - uses: ./.github/actions/turbo-save
        with:
          key: ${{ steps.turbo-cache.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: e2e/test-results
          if-no-files-found: ignore
  container-smoke:
    name: Container smoke
    needs: changes
    if: needs.changes.outputs.container_smoke == 'true'
    uses: ./.github/workflows/container-smoke.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}
  desktop:
    name: Native acceptance
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.native_runners) }}
    uses: ./.github/workflows/native.yml
    with:
      runner: ${{ matrix.os }}
      distribution: ${{ needs.changes.outputs.distribution == 'true' }}
      cold_native: ${{ inputs.cold_native || false }}
    secrets: inherit
  foundation:
    name: CI result
    if: always()
    needs: [changes, source, backend, browser, desktop, container-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require every selected gate to pass
        env:
          GITHUB_NEEDS: ${{ toJSON(needs) }}
          RAYPX_DISTRIBUTION_REQUEST: ${{ inputs.distribution || false }}
        run: bun packages/dev-cli/src/verification/result.ts
