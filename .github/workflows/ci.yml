name: CI
on:
  pull_request:
  push:
    branches: [canary]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raypx
          POSTGRES_PASSWORD: raypx
          POSTGRES_DB: raypx_foundation_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raypx -d raypx_foundation_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json
      - name: Restore Bun downloads
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
      - run: bun install --frozen-lockfile
        id: install
      - name: Save Bun downloads
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Restore Turbo tasks
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ github.job }}-
      - run: bun run verify
      - run: bun run test:postgres
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://raypx:raypx@127.0.0.1:5432/raypx_foundation_ci_test
      - run: bun run test:redis
        env:
          NODE_ENV: test
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: bun run test:cloudflare:postgres
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://raypx:raypx@127.0.0.1:5432/raypx_foundation_ci_test
      - run: bun --bun playwright install --with-deps chromium
        working-directory: e2e
      - run: bun run test:e2e
      - name: Generated sources remain reproducible
        run: git diff --exit-code
      - name: Save successful Turbo tasks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: e2e/test-results
          if-no-files-found: ignore
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json
      - name: Restore Bun downloads
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
      - run: bun install --frozen-lockfile
        id: install
      - name: Save Bun downloads
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Restore Turbo tasks
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ github.job }}-
      - run: bun run desktop:build
      - name: Native release checks
        run: bun run --cwd apps/desktop native:smoke
      - name: Save successful Turbo tasks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
