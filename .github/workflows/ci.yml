name: CI
on:
  pull_request:
  push:
    branches: [main, canary]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raypx
          POSTGRES_PASSWORD: raypx
          POSTGRES_DB: raypx_foundation_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raypx -d raypx_foundation_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:postgres
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://raypx:raypx@127.0.0.1:5432/raypx_foundation_ci_test
      - run: bun --bun playwright install --with-deps chromium
        working-directory: e2e
      - run: bun run test:e2e
      - name: Generated sources remain reproducible
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: e2e/test-results
          if-no-files-found: ignore
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run mobile:check
      - run: bun run mobile:bundle
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run desktop:build
      - name: Native release checks
        run: bun run --cwd apps/desktop native:smoke
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix develop --command bun --version
      - run: nix develop --command node --version
      - run: nix develop --command psql --version
