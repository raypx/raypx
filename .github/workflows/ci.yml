name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun run check:env
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test UI interactions and accessibility
        run: bun run storybook:test
      - name: Test application in development and production
        run: bun run test:e2e
      - name: Test independent UI consumer
        run: bun run test:consumer:browser
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            playwright-report/
            test-results/
          if-no-files-found: ignore
