name: CI
on:
  pull_request:
  push:
    branches: [canary, next]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      distribution:
        description: Build installers and run full packaged native acceptance
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.distribution || false }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.plan.outputs.native }}
      backend: ${{ steps.plan.outputs.backend }}
      browser: ${{ steps.plan.outputs.browser }}
      rust: ${{ steps.plan.outputs.rust }}
      distribution: ${{ steps.plan.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Select affected verification gates
        id: plan
        run: bun run raypx-dev ci:plan
  javascript:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/vp-restore
        id: vp-cache
        with:
          partition: javascript
      - name: Verify affected source and artifacts
        run: bun run raypx-dev ci:gate js
      - name: Generated sources remain reproducible
        run: git diff --exit-code
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.vp-cache.outputs.key }}
  libraries:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raypx
          POSTGRES_PASSWORD: raypx
          POSTGRES_DB: raypx_foundation_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raypx -d raypx_foundation_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://raypx:raypx@127.0.0.1:5432/raypx_foundation_ci_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun run raypx-dev ci:gate backend
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/vp-restore
        id: vp-cache
        with:
          partition: browser
      - run: bun --bun playwright install --with-deps chromium
        working-directory: e2e
      - run: bun run raypx-dev ci:gate browser
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.vp-cache.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: e2e/test-results
          if-no-files-found: ignore
  desktop:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    uses: ./.github/workflows/native.yml
    with:
      runner: ${{ matrix.os }}
      distribution: ${{ needs.changes.outputs.distribution == 'true' }}
    secrets: inherit
  foundation:
    if: always()
    needs: [changes, javascript, backend, browser, desktop, libraries]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require every selected gate to pass
        env:
          GITHUB_NEEDS: ${{ toJSON(needs) }}
          RAYPX_DISTRIBUTION_REQUEST: ${{ inputs.distribution || false }}
        run: bun packages/tooling/src/verification/result.ts
