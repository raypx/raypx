name: Prepare supported Node and pinned pnpm dependencies
description: Read Node and pnpm from the root manifest and perform a frozen isolated install
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
    - uses: pnpm/action-setup@v5
    - shell: bash
      run: pnpm install --frozen-lockfile
