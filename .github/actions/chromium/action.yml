name: Setup Chromium
description: Cache the installed Playwright revision while always preparing Linux system dependencies.

outputs:
  cache-hit:
    description: Whether the exact Chromium binary cache was restored.
    value: ${{ steps.chromium-cache.outputs.cache-hit }}
  version:
    description: The Playwright version resolved from the installed locked dependency.
    value: ${{ steps.playwright.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve installed Playwright browser metadata
      id: playwright
      shell: bash
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/resolve-version.mjs"
        printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/raypx-playwright" >> "$GITHUB_ENV"
    - name: Cache Chromium binaries
      id: chromium-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/raypx-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-r${{ steps.playwright.outputs.revision }}-${{ steps.playwright.outputs.metadata-hash }}
    - name: Install Chromium system dependencies
      shell: bash
      run: bunx --no-install playwright install-deps chromium
    - name: Ensure matching Chromium binaries are installed
      shell: bash
      run: bunx --no-install playwright install chromium
