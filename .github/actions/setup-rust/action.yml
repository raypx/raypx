name: Prepare pinned Rust
description: Install the toolchain selected by rust-toolchain.toml
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        toolchain="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const text=readFileSync("rust-toolchain.toml","utf8"); console.log(text.match(/channel\s*=\s*"([^"]+)"/)[1])')"
        rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
    - uses: Swatinem/rust-cache@v2
