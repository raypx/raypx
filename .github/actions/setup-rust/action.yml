name: Prepare pinned Rust
description: Install the toolchain selected by rust-toolchain.toml
inputs:
  cache:
    description: Restore and save Cargo caches
    default: "true"
  cache-key:
    description: Separate native check, production and smoke compiler artifacts
    default: ""
  target-directory:
    description: Cargo output directory for this phase
    default: target
  check-profile:
    description: Omit development and test debug symbols for CI source checks
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RAYPX_RUST_CHECK_PROFILE: ${{ inputs.check-profile }}
      run: |
        if [ "$RAYPX_RUST_CHECK_PROFILE" = "true" ]; then
          printf '%s\n' CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 >> "$GITHUB_ENV"
        fi
        # Rustup installs the toolchain, profile and components from this file.
        test -f rust-toolchain.toml
        rustup show active-toolchain
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true'
      with:
        key: ${{ inputs.cache-key }}
        workspaces: . -> ${{ inputs.target-directory }}
        # Cargo fingerprints incomplete builds; unrelated smoke failures should not
        # discard successfully compiled dependencies.
        cache-on-failure: "true"
