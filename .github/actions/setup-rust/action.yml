name: Prepare pinned Rust
description: Install the toolchain selected by rust-toolchain.toml
inputs:
  cache:
    description: Restore and save Cargo caches
    default: "true"
  cache-key:
    description: Separate native check, production and smoke compiler artifacts
    default: ""
  target-directory:
    description: Cargo output directory for this phase
    default: target
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        toolchain="$(bun -e 'import {readFileSync} from "node:fs"; const text=readFileSync("rust-toolchain.toml","utf8"); console.log(text.match(/channel\s*=\s*"([^"]+)"/)[1])')"
        rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true'
      with:
        key: ${{ inputs.cache-key }}
        workspaces: . -> ${{ inputs.target-directory }}
        # Cargo fingerprints incomplete builds; unrelated smoke failures should not
        # discard successfully compiled dependencies.
        cache-on-failure: "true"
