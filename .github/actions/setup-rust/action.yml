name: Prepare pinned Rust toolchain
description: Isolate the repository compiler from preinstalled runner toolchains
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RUSTUP_HOME: ${{ runner.temp }}/raypx-rustup
      run: |
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        rustup show
