name: raypx-beta

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raypx_beta
      POSTGRES_USER: raypx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the beta database password}
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=128MB"]
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raypx -d raypx_beta"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: raypx/api-migrate:${RAYPX_RELEASE:?Set the image release}
    pull_policy: never
    restart: "no"
    environment:
      DATABASE_URL: postgres://raypx:${POSTGRES_PASSWORD:?}@postgres:5432/raypx_beta
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    mem_limit: 512m
    cpus: 0.5

  api:
    image: raypx/api:${RAYPX_RELEASE:?}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://raypx:${POSTGRES_PASSWORD:?}@postgres:5432/raypx_beta
      AUTH_URL: https://${BETA_HOST:?Set the beta hostname}
      AUTH_SECRET: ${AUTH_SECRET:?Set the authentication secret}
      ALLOWED_ORIGINS: https://${BETA_HOST:?},views://main,raypx://
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_IP_HEADERS: ${AUTH_IP_HEADERS:-x-forwarded-for}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:?Set the trusted proxy CIDRs}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      JOBS_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, proxy]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.raypx-beta-api.rule: "Host(`${BETA_HOST:?}`) && (PathPrefix(`/api/`) || PathPrefix(`/rpc/`) || Path(`/relay`) || Path(`/health`) || Path(`/ready`))"
      traefik.http.routers.raypx-beta-api.priority: "100"
      traefik.http.routers.raypx-beta-api.entrypoints: websecure
      traefik.http.routers.raypx-beta-api.tls.certresolver: letsencrypt
      traefik.http.services.raypx-beta-api.loadbalancer.server.port: "3002"

  web:
    image: raypx/web:${RAYPX_RELEASE:?}
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    networks: [proxy]
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.raypx-beta-web.rule: "Host(`${BETA_HOST:?}`)"
      traefik.http.routers.raypx-beta-web.priority: "1"
      traefik.http.routers.raypx-beta-web.entrypoints: websecure
      traefik.http.routers.raypx-beta-web.tls.certresolver: letsencrypt
      traefik.http.services.raypx-beta-web.loadbalancer.server.port: "3000"
      traefik.http.routers.raypx-beta-http.rule: "Host(`${BETA_HOST:?}`)"
      traefik.http.routers.raypx-beta-http.entrypoints: web
      traefik.http.routers.raypx-beta-http.service: raypx-beta-web
      traefik.http.routers.raypx-beta-http.middlewares: raypx-beta-https
      traefik.http.middlewares.raypx-beta-https.redirectscheme.scheme: https

volumes:
  postgres:
    name: raypx-beta-postgres

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: dokploy-network
