services:
  postgres:
    image: postgres:17-alpine@sha256:${POSTGRES_IMAGE_DIGEST:?Set the verified PostgreSQL manifest digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the environment database name}
      POSTGRES_USER: ${POSTGRES_USER:-raypx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the environment database password}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: ${POSTGRES_MEMORY:-512m}
    cpus: ${POSTGRES_CPUS:-1}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: raypx/api-migrate:${COMPOSE_PROJECT_NAME:?}-${RAYPX_RELEASE:?Set the image release}
    pull_policy: never
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-raypx}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      APP_KEY: ${APP_KEY:?Set the application key}
      DB_MIGRATE_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-raypx_runtime}
      DB_MIGRATE_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set the runtime database password}
      DB_MIGRATE_IMPORT_CONFIG: ${DB_MIGRATE_IMPORT_CONFIG:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DEFAULT_LOCALE: ${MAIL_DEFAULT_LOCALE:-en}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    mem_limit: ${MIGRATE_MEMORY:-512m}
    cpus: ${MIGRATE_CPUS:-0.5}

  api:
    image: raypx/api:${COMPOSE_PROJECT_NAME:?}-${RAYPX_RELEASE:?}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SERVER_ROLE: ${SERVER_ROLE:-all}
      DATABASE_MIGRATE_ON_START: "false"
      DATABASE_URL: postgres://${POSTGRES_RUNTIME_USER:-raypx_runtime}:${POSTGRES_RUNTIME_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      AUTH_URL: https://${APP_HOST:?Set the application hostname}
      AUTH_SECRET: ${AUTH_SECRET:?Set the authentication secret}
      APP_KEY: ${APP_KEY:?Set the application key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_ORIGINS: https://${APP_HOST:?},views://main,raypx://
      COMPUTER_PROVIDER: ${COMPUTER_PROVIDER:-none}
      SANDBOX_SUPERVISOR_URL: ${SANDBOX_SUPERVISOR_URL:-}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:-}
      COMPUTERS_PER_MEMBER: ${COMPUTERS_PER_MEMBER:-10}
      COMPUTERS_PER_SPACE: ${COMPUTERS_PER_SPACE:-1}
      AGENT_MODELS: ${AGENT_MODELS:-}
      AGENT_MODEL_CREDENTIALS: ${AGENT_MODEL_CREDENTIALS:-}
      APPROVAL_DEFAULT_MODE: ${APPROVAL_DEFAULT_MODE:-ask}
      APPROVAL_REQUEST_TTL_MS: ${APPROVAL_REQUEST_TTL_MS:-600000}
      RUN_RECOVERY_INTERVAL_MS: ${RUN_RECOVERY_INTERVAL_MS:-5000}
      RUN_LEASE_MS: ${RUN_LEASE_MS:-15000}
      RUN_HEARTBEAT_MS: ${RUN_HEARTBEAT_MS:-5000}
      RUN_ATTEMPT_TIMEOUT_MS: ${RUN_ATTEMPT_TIMEOUT_MS:-300000}
      RUN_BACKUP_MARGIN_MS: ${RUN_BACKUP_MARGIN_MS:-30000}
      ROUTINE_EMAIL_RELAY_TOKEN: ${ROUTINE_EMAIL_RELAY_TOKEN:-}
      ROUTINE_EMAIL_DOMAIN: ${ROUTINE_EMAIL_DOMAIN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_IP_HEADERS: ${AUTH_IP_HEADERS:-x-forwarded-for}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:?Set the trusted proxy CIDRs}
      AUTH_PASSKEY_RP_ID: ${AUTH_PASSKEY_RP_ID:-}
      AUTH_CHECK_COMPROMISED_PASSWORDS: ${AUTH_CHECK_COMPROMISED_PASSWORDS:-false}
      AUTH_TURNSTILE_SITE_KEY: ${AUTH_TURNSTILE_SITE_KEY:-}
      AUTH_TURNSTILE_SECRET_KEY: ${AUTH_TURNSTILE_SECRET_KEY:-}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
      REDIS_URL: ${REDIS_URL:-}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, proxy, sandbox-control]
    mem_limit: ${API_MEMORY:-768m}
    cpus: ${API_CPUS:-1}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3002/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-${COMPOSE_PROJECT_NAME:?}-ingress}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-api.rule=Host(`${APP_HOST:?}`) && (PathPrefix(`/api/`) || PathPrefix(`/rpc/`) || PathPrefix(`/routines/`) || Path(`/.well-known/openid-configuration`) || Path(`/.well-known/oauth-authorization-server`) || Path(`/events`) || Path(`/health`) || Path(`/ready`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-api.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:?}-api.loadbalancer.server.port=3002"

      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.rule=Host(`${APP_HOST:?}`) && Path(`/relay`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.priority=110"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.middlewares=${COMPOSE_PROJECT_NAME:?}-relay-headers"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:?}-relay-headers.headers.customrequestheaders.Cookie="
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:?}-relay-headers.headers.customrequestheaders.Authorization="
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.service=${COMPOSE_PROJECT_NAME:?}-api"

  sandbox:
    profiles: [sandbox]
    image: raypx/sandbox:${COMPOSE_PROJECT_NAME:?}-${RAYPX_RELEASE:?}
    build:
      context: ..
      dockerfile: infra/sandbox/Dockerfile
      args:
        BUN_IMAGE_DIGEST: ${BUN_IMAGE_DIGEST:-}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      SANDBOX_LISTEN_ADDRESS: ${SANDBOX_LISTEN_ADDRESS:-172.30.40.2}
      SANDBOX_PORT: "4020"
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:-}
      SANDBOX_COMPUTER_IMAGE: ${SANDBOX_COMPUTER_IMAGE:-}
      SANDBOX_NAMESPACE: ${COMPOSE_PROJECT_NAME:?}
      SANDBOX_ENGINE_SOCKET: /var/run/docker.sock
      SANDBOX_STATE_DIRECTORY: /var/lib/raypx-sandbox
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-536870912}
      SANDBOX_NANO_CPUS: ${SANDBOX_NANO_CPUS:-1000000000}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      SANDBOX_RESTRICTED_EGRESS: ${SANDBOX_RESTRICTED_EGRESS:-false}
      SANDBOX_HOST_RULES_APPLIED: ${SANDBOX_HOST_RULES_APPLIED:-false}
    volumes:
      - type: bind
        source: ${SANDBOX_ENGINE_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
      - sandbox-state:/var/lib/raypx-sandbox
    networks:
      sandbox-control:
        ipv4_address: ${SANDBOX_LISTEN_ADDRESS:-172.30.40.2}
    mem_limit: 256m
    cpus: 0.5

  web:
    image: raypx/web:${COMPOSE_PROJECT_NAME:?}-${RAYPX_RELEASE:?}
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    networks: [proxy]
    mem_limit: ${WEB_MEMORY:-512m}
    cpus: ${WEB_CPUS:-0.75}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-${COMPOSE_PROJECT_NAME:?}-ingress}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-web.rule=Host(`${APP_HOST:?}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-web.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-web.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:?}-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-http.rule=Host(`${APP_HOST:?}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-http.service=${COMPOSE_PROJECT_NAME:?}-web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-http.middlewares=${COMPOSE_PROJECT_NAME:?}-https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:?}-https.redirectscheme.scheme=https"

volumes:
  sandbox-state:
  postgres:
    name: ${POSTGRES_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:?}_postgres}

networks:
  sandbox-control:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_CONTROL_SUBNET:-172.30.40.0/24}
  backend:
    internal: true
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-${COMPOSE_PROJECT_NAME:?}-ingress}
