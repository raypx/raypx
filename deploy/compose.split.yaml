# Optional distributed topology. Every role uses the SAME backend image.
# Durable Run API/worker coordination requires PostgreSQL only. Configure REDIS_URL
# for device Computer frames across separate roles.
# docker compose -f deploy/compose.yaml -f deploy/compose.split.yaml ...
services:
  api:
    environment:
      SERVER_ROLE: api
      REDIS_URL: ${REDIS_URL:-}
    labels:
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}-relay.service=${COMPOSE_PROJECT_NAME:?}-relay"

  relay:
    image: raypx/api:${COMPOSE_PROJECT_NAME:?}-${RAYPX_RELEASE:?}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SERVER_ROLE: relay
      DEVICE_CONNECTOR_ORIGIN: ${DEVICE_CONNECTOR_ORIGIN:-https://${APP_HOST:?}}
      DATABASE_URL: postgres://${POSTGRES_RUNTIME_USER:-raypx_runtime}:${POSTGRES_RUNTIME_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: ${REDIS_URL:-}
      ALLOWED_ORIGINS: https://${APP_HOST:?},views://main,raypx://
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, proxy]
    mem_limit: ${RELAY_MEMORY:-512m}
    cpus: ${RELAY_CPUS:-0.75}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3002/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-${COMPOSE_PROJECT_NAME:?}-ingress}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:?}-relay.loadbalancer.server.port=3002"

  worker:
    image: raypx/api:${COMPOSE_PROJECT_NAME:?}-${RAYPX_RELEASE:?}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SERVER_ROLE: worker
      DEVICE_CONNECTOR_ORIGIN: ${DEVICE_CONNECTOR_ORIGIN:-https://${APP_HOST:?}}
      REDIS_URL: ${REDIS_URL:-}
      APP_KEY: ${APP_KEY:?Set the application key}
      DATABASE_MIGRATE_ON_START: "false"
      DATABASE_URL: postgres://${POSTGRES_RUNTIME_USER:-raypx_runtime}:${POSTGRES_RUNTIME_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      COMPUTER_PROVIDER: ${COMPUTER_PROVIDER:-none}
      SANDBOX_SUPERVISOR_URL: ${SANDBOX_SUPERVISOR_URL:-}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:-}
      COMPUTERS_PER_MEMBER: ${COMPUTERS_PER_MEMBER:-10}
      COMPUTERS_PER_SPACE: ${COMPUTERS_PER_SPACE:-1}
      AGENT_MODELS: ${AGENT_MODELS:-}
      AGENT_MODEL_CREDENTIALS: ${AGENT_MODEL_CREDENTIALS:-}
      APPROVAL_REVIEW_MODEL_ID: ${APPROVAL_REVIEW_MODEL_ID:-}
      APPROVAL_DEFAULT_MODE: ${APPROVAL_DEFAULT_MODE:-ask}
      APPROVAL_REQUEST_TTL_MS: ${APPROVAL_REQUEST_TTL_MS:-600000}
      RUN_RECOVERY_INTERVAL_MS: ${RUN_RECOVERY_INTERVAL_MS:-5000}
      RUN_LEASE_MS: ${RUN_LEASE_MS:-15000}
      RUN_HEARTBEAT_MS: ${RUN_HEARTBEAT_MS:-5000}
      RUN_ATTEMPT_TIMEOUT_MS: ${RUN_ATTEMPT_TIMEOUT_MS:-300000}
      RUN_BACKUP_MARGIN_MS: ${RUN_BACKUP_MARGIN_MS:-30000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, sandbox-control]
    mem_limit: ${WORKER_MEMORY:-768m}
    cpus: ${WORKER_CPUS:-1}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3002/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
