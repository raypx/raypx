name: raypx-foundation
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raypx_foundation
      POSTGRES_USER: raypx
      POSTGRES_PASSWORD: raypx
    ports:
      - "5433:5432"
    volumes:
      - foundation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raypx -d raypx_foundation"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  foundation-postgres:
    name: raypx-foundation-postgres
